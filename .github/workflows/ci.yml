name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.7.2-linux

      - name: Install Godot
        run: |
          tools/install_godot.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run GUT tests
        run: bash tools/run_tests.sh

  web-export:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.7.2-linux

      - name: Install Godot
        run: |
          tools/install_godot.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Godot export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2

      - name: Download and install export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          TMP_DIR=$(mktemp -d)
          curl -fsSL -o "$TMP_DIR/templates.tpz" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q "$TMP_DIR/templates.tpz" -d "$TMP_DIR"
          mv "$TMP_DIR/templates"/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rm -rf "$TMP_DIR"

      - name: Export Web project
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          if [ ! -f build/web/index.html ] || [ ! -f build/web/index.wasm ]; then
            echo "Web export artifacts missing!" >&2
            exit 1
          fi

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
