# Local stack: Nakama 3.41.0 + Postgres 16. Console http://127.0.0.1:7351 (admin / password), API :7350.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
    expose:
      - "5432"

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.41.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdev@postgres:5432/nakama
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./build:/nakama/data/modules:ro
      - ./local.yml:/nakama/data/local.yml:ro
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
