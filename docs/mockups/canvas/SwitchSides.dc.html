<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switching sides transition</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Open Sans',system-ui,sans-serif}</style>
</helmet>
<div style="position:relative;width:1280px;height:720px;overflow:hidden;background:linear-gradient(105deg,#eaf3fb 0,#eaf3fb 50%,#1a0709 50%,#1a0709 100%);font-family:'Open Sans',system-ui,sans-serif">

  <!-- defender side, fading out -->
  <div style="position:absolute;left:120px;top:110px;width:150px;height:150px;border-radius:50%;background:#2e86de;opacity:0.35"></div>
  <div style="position:absolute;left:320px;top:250px;width:120px;height:120px;background:#48dbfb;opacity:0.4;clip-path:polygon(50% 4%,96% 94%,4% 94%)"></div>
  <div style="position:absolute;left:90px;top:400px;width:110px;height:110px;border-radius:12px;background:#c8b98a;opacity:0.5"></div>
  <div style="position:absolute;left:250px;top:530px;width:130px;height:130px;border-radius:20px;background:#8e44ad;opacity:0.3"></div>

  <!-- pathogen side, growing -->
  <div style="position:absolute;left:1000px;top:100px;width:90px;height:90px;border-radius:50%;background:#2ecc71"></div>
  <div style="position:absolute;left:1120px;top:190px;width:60px;height:60px;border-radius:50%;background:#2ecc71;opacity:0.8"></div>
  <div style="position:absolute;left:900px;top:240px;width:70px;height:70px;border-radius:50%;background:#2ecc71;opacity:0.6"></div>
  <div style="position:absolute;left:1060px;top:420px;width:150px;height:150px;background:#e67e22;clip-path:polygon(28% 6%,72% 6%,88% 46%,72% 58%,92% 94%,80% 94%,60% 66%,40% 66%,20% 94%,8% 94%,28% 58%,12% 46%)"></div>
  <div style="position:absolute;left:930px;top:560px;width:120px;height:120px;background:radial-gradient(circle at 32% 34%,#f1c40f 0 22%,transparent 23%),radial-gradient(circle at 68% 34%,#f1c40f 0 22%,transparent 23%),radial-gradient(circle at 50% 70%,#f1c40f 0 26%,transparent 27%)"></div>

  <!-- centre card -->
  <div style="position:absolute;left:340px;top:170px;width:600px;box-sizing:border-box;background:#2a0b10;border:2px solid #59202a;border-radius:20px;padding:40px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.4)">
    <div style="font-size:13px;font-weight:700;letter-spacing:0.16em;color:#d3aab0">END OF SYNTHESIS</div>
    <div style="font-size:52px;font-weight:800;line-height:1.05;color:#f5e6e8">Switching sides</div>
    <div style="font-size:26px;font-weight:700;color:#2ecc71">You are now the Pathogen</div>
    <div style="font-size:16px;line-height:1.5;color:#d3aab0;max-width:440px">Your base is locked in. Spend the 240 ATP you kept on an army and deploy it from the outer ring.</div>
    <a href="SpawnBuying.dc.html" style="box-sizing:border-box;margin-top:12px;height:60px;padding:0 40px;border-radius:14px;background:#2ecc71;color:#0a2414;display:flex;align-items:center;font-size:20px;font-weight:800;text-decoration:none">Begin Incubation</a>
    <div style="font-size:14px;color:#d3aab0">Continues automatically in 3 s</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
