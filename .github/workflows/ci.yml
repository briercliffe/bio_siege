name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.7.2-linux

      - name: Install Godot
        run: |
          tools/install_godot.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run GUT tests
        run: bash tools/run_tests.sh

  web-export:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.7.2-linux

      - name: Install Godot
        run: |
          tools/install_godot.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Godot export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2

      - name: Download and install export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          TMP_DIR=$(mktemp -d)
          curl -fsSL -o "$TMP_DIR/templates.tpz" https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q "$TMP_DIR/templates.tpz" -d "$TMP_DIR"
          mv "$TMP_DIR/templates"/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rm -rf "$TMP_DIR"

      - name: Export Web project
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          if [ ! -f build/web/index.html ] || [ ! -f build/web/index.wasm ]; then
            echo "Web export artifacts missing!" >&2
            exit 1
          fi

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/

  android-export:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/godot
          key: godot-4.7.2-linux

      - name: Cache Godot export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-templates-4.7.2

      - name: Download and install export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable
          TMP_DIR=$(mktemp -d)
          curl -fsSL -o "$TMP_DIR/templates.tpz" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q "$TMP_DIR/templates.tpz" -d "$TMP_DIR"
          mv "$TMP_DIR/templates"/* ~/.local/share/godot/export_templates/4.7.2.stable/
          rm -rf "$TMP_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0" "platforms;android-35"

      - name: Install Godot
        run: |
          tools/install_godot.sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Restore debug keystore
        run: |
          mkdir -p .godot
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > .godot/debug.keystore

      - name: Import project assets
        run: godot --headless --path . --import

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/bio_siege.apk
          if [ ! -f build/android/bio_siege.apk ]; then
            echo "Android APK missing after export!" >&2
            exit 1
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/android/bio_siege.apk
          retention-days: 30
