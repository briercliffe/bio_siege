<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Open Sans',system-ui,sans-serif}</style>
</helmet>
<div style="position:relative;width:1280px;height:720px;overflow:hidden;background:#d8e9f7;color:#12304f;font-family:'Open Sans',system-ui,sans-serif">
  <div style="position:absolute;left:0;top:0"><dc-import name="Ambient" theme="day" hint-size="1280px,720px"></dc-import></div>

  <a href="Main.dc.html" style="position:absolute;left:32px;top:28px;box-sizing:border-box;height:52px;padding:0 24px 0 16px;border-radius:26px;background:rgba(255,255,255,0.9);border:2px solid #ffffff;box-shadow:0 8px 22px rgba(18,48,79,0.16);color:#12304f;display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;text-decoration:none">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12304f" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back
  </a>
  <div style="position:absolute;left:0;top:26px;width:1280px;text-align:center">
    <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;color:#1e5aa8">PREFERENCES</div>
    <h1 style="margin:2px 0 0;font-size:40px;font-weight:800">Settings</h1>
  </div>

  <div style="position:absolute;left:320px;top:112px;width:640px;box-sizing:border-box;border-radius:36px;background:rgba(255,255,255,0.92);border:2px solid #ffffff;box-shadow:0 12px 30px rgba(18,48,79,0.18);padding:12px 28px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:20px;min-height:72px;border-bottom:1px solid #dbe9f6">
      <div style="flex:1"><div style="font-size:17px;font-weight:700">Master volume</div><div style="font-size:14px;color:#576574">Placeholder sounds only for now</div></div>
      <div style="position:relative;flex:none;width:220px;height:48px">
        <div style="position:absolute;left:0;top:19px;width:220px;height:10px;border-radius:5px;background:#dbe9f6"></div>
        <div style="position:absolute;left:0;top:19px;width:154px;height:10px;border-radius:5px;background:#1e5aa8"></div>
        <div style="position:absolute;left:136px;top:8px;width:32px;height:32px;border-radius:50%;background:#ffffff;box-shadow:0 2px 8px rgba(18,48,79,0.35),inset 0 0 0 3px #1e5aa8"></div>
      </div>
    </div>
    <sc-for list="{{toggles}}" as="t" hint-placeholder-count="5">
      <div style="display:flex;align-items:center;gap:20px;min-height:72px;border-bottom:1px solid #dbe9f6">
        <div style="flex:1"><div style="font-size:17px;font-weight:700">{{t.label}}</div><div style="font-size:14px;color:#576574">{{t.hint}}</div></div>
        <button role="switch" aria-checked="{{t.on}}" aria-label="{{t.label}}" onClick="{{t.flip}}" style="position:relative;flex:none;width:64px;height:48px;padding:0;border:0;border-radius:24px;background:transparent;cursor:pointer">
          <span style="position:absolute;left:0;top:8px;width:64px;height:32px;border-radius:16px;background:{{t.track}}"></span>
          <span style="position:absolute;top:12px;left:{{t.knobLeft}}px;width:24px;height:24px;border-radius:50%;background:#ffffff;box-shadow:0 2px 6px rgba(18,48,79,0.35)"></span>
        </button>
      </div>
    </sc-for>
    <div style="display:flex;align-items:center;gap:20px;min-height:72px">
      <div style="flex:1"><div style="font-size:17px;font-weight:700">Reset tutorial hints</div><div style="font-size:14px;color:#576574">Show the first-time tips again</div></div>
      <button style="flex:none;height:48px;padding:0 24px;border-radius:24px;border:2px solid #c5d9ed;background:#ffffff;color:#12304f;font-size:15px;font-weight:700">Reset</button>
    </div>
  </div>
  <div style="position:absolute;left:0;top:672px;width:1280px;text-align:center;font-size:13px;color:#3f5670">Telemetry is anonymous session logs: phase timings, spending split and battle outcomes.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sfx: true, intent: true, flash: false, telemetry: true, debug: false };
  }
  renderVals() {
    const defs = [
      { id: 'sfx', label: 'Sound effects', hint: 'Hits, deaths and button taps' },
      { id: 'intent', label: 'Intent lines by default', hint: 'Show each pathogen’s target in battle' },
      { id: 'flash', label: 'Reduce screen flashes', hint: 'Softer hit flashes and death puffs' },
      { id: 'telemetry', label: 'Share playtest telemetry', hint: 'Helps balance the game' },
      { id: 'debug', label: 'Debug overlay', hint: 'Frame time and sim tick, dev builds only' }
    ];
    const toggles = defs.map((d) => {
      const on = !!this.state[d.id];
      return {
        label: d.label, hint: d.hint, on: on ? 'true' : 'false',
        track: on ? '#1e5aa8' : '#9fb3c8', knobLeft: on ? 36 : 4,
        flip: () => this.setState({ [d.id]: !this.state[d.id] })
      };
    });
    return { toggles: toggles };
  }
}
</script>
</body>
</html>
